  .spark { position: absolute; color: #ffd6f0; animation: float linear infinite; opacity: 0; }

  <div class="text">Ấn vào màn hình để nhận 100K Quân huy</div>
</div>

<div id="player">
  <video id="video" playsinline loop controls></video>
  <div id="picker">
    <p>Không phát được video. Hãy chọn file video từ máy:</p>
    <button id="pickBtn">Chọn video</button>
    <input type="file" id="fileInput" accept="video/*" hidden>
  </div>
</div>

<script>
  // Video nằm cùng thư mục với file HTML (đổi tên nếu cần)
  const VIDEO_SRC = "video.mp4";

  const intro = document.getElementById("intro");
  const player = document.getElementById("player");
  const video = document.getElementById("video");
  const picker = document.getElementById("picker");
  const fileInput = document.getElementById("fileInput");

  // hiệu ứng lấp lánh
  for (let i = 0; i < 22; i++) {
    const s = document.createElement("div");
    s.className = "spark";
    s.textContent = ["✦", "✧", "♥", "★"][i % 4];
    s.style.left = Math.random() * 100 + "vw";
    s.style.bottom = "-20px";
    s.style.fontSize = 12 + Math.random() * 22 + "px";
    s.style.animationDuration = 5 + Math.random() * 6 + "s";
    s.style.animationDelay = Math.random() * 6 + "s";
    intro.appendChild(s);
  }

  function goFullscreen() {
    const el = player;
    const req = el.requestFullscreen || el.webkitRequestFullscreen || el.msRequestFullscreen;
    if (req) { try { const p = req.call(el); if (p && p.catch) p.catch(() => {}); } catch (e) {} }
    // iPhone Safari: chỉ hỗ trợ fullscreen cho thẻ video
    if (!req && video.webkitEnterFullscreen) { try { video.webkitEnterFullscreen(); } catch (e) {} }
  }

  let started = false;
  intro.addEventListener("click", () => {
    if (started) return;
    started = true;
    intro.classList.add("hide");
    player.classList.add("show");
    goFullscreen();

    video.src = VIDEO_SRC;
    video.loop = true;
    video.play().catch(() => {});
  });

  video.addEventListener("error", () => { picker.style.display = "block"; });

  document.getElementById("pickBtn").addEventListener("click", () => fileInput.click());
  fileInput.addEventListener("change", () => {
    const f = fileInput.files[0];
    if (!f) return;
    picker.style.display = "none";
    video.src = URL.createObjectURL(f);
    video.play().catch(() => {});
  });
</script>
</body>
